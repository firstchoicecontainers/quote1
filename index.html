<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>First Choice Containers</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0d47a1,#1976d2,#42a5f5);
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.wrapper{
    text-align:center;
    z-index:2;
    width:min(90%,500px);
}

.logo{
    font-size:42px;
    font-weight:700;
    margin-bottom:10px;
}

.logo .blue{
    color:#ffffff;
}

.logo .blue2{
    color:#42a5f5;
}

.logo .red{
    color:#ff5252;
}

.subtitle{
    font-size:18px;
    opacity:.9;
    margin-bottom:35px;
}

.spinner{
    width:90px;
    height:90px;
    margin:auto;
    border:6px solid rgba(255,255,255,.2);
    border-top:6px solid #fff;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

.loadingText{
    margin-top:25px;
    font-size:20px;
    font-weight:600;
}

.message{
    margin-top:10px;
    opacity:.85;
    min-height:22px;
}

.progress{
    width:100%;
    height:10px;
    background:rgba(255,255,255,.2);
    border-radius:20px;
    margin-top:35px;
    overflow:hidden;
}

.progress span{
    display:block;
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#42a5f5,#ffffff,#ff5252);
    animation:progress 2.8s linear forwards;
}

.footer{
    margin-top:25px;
    font-size:14px;
    opacity:.8;
}

.containerBox{
    position:absolute;
    width:80px;
    height:45px;
    border-radius:6px;
    background:#ffffff22;
    border:2px solid rgba(255,255,255,.35);
    animation:float 14s linear infinite;
}

.containerBox:before{
    content:"";
    position:absolute;
    left:8px;
    right:8px;
    top:10px;
    height:3px;
    background:white;
    box-shadow:0 8px white,0 16px white;
}

.box1{
    left:-100px;
    top:12%;
    animation-delay:0s;
}

.box2{
    left:-150px;
    top:35%;
    animation-delay:4s;
}

.box3{
    left:-120px;
    top:68%;
    animation-delay:8s;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

@keyframes progress{
    from{width:0;}
    to{width:100%;}
}

@keyframes float{
    from{
        transform:translateX(-150px) rotate(0deg);
    }
    to{
        transform:translateX(calc(100vw + 300px)) rotate(360deg);
    }
}

@media(max-width:600px){
.logo{
    font-size:30px;
}
.subtitle{
    font-size:16px;
}
}
</style>

<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwEhnPgwywvIHbZlaWlkXZbfeCnlOFvd_HxjF0U3nfJFdn6cPzkknc88mCxq2Jjmpvg/exec";

const messages=[
"Preparing your workspace...",
"Loading quotation data...",
"Checking latest information...",
"Almost ready...",
"Redirecting securely..."
];

window.onload=function(){

let i=0;

const msg=document.getElementById("msg");

msg.textContent=messages[0];

const timer=setInterval(()=>{
    i=(i+1)%messages.length;
    msg.textContent=messages[i];
},550);

setTimeout(()=>{
    clearInterval(timer);
    window.location.replace(
        APPS_SCRIPT_URL + window.location.search
    );
},2800);

};

</script>

</head>

<body>

<div class="containerBox box1"></div>
<div class="containerBox box2"></div>
<div class="containerBox box3"></div>

<div class="wrapper">

<div class="logo">
<span class="blue2">First Choice</span>
<span class="red">Containers</span>
</div>

<div class="subtitle">
Please wait while we prepare your request.
</div>

<div class="spinner"></div>

<div class="loadingText">
Loading...
</div>

<div class="message" id="msg"></div>

<div class="progress">
<span></span>
</div>

<div class="footer">
Powered by First Choice Containers
</div>

</div>

</body>
</html>
