<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>First Choice Containers</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#ffffff;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    text-align:center;
    padding:20px;
}

.company-logo{
    width:340px;
    max-width:90vw;
    height:auto;
    margin-bottom:25px;
}

.spinner{
    width:54px;
    height:54px;
    margin:0 auto 20px;
    border:5px solid #e5e5e5;
    border-top:5px solid #2E63D7;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

.loading-text{
    font-size:18px;
    color:#555;
    font-weight:600;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="container">

    <img
        src="logo.png"
        alt="First Choice Containers"
        class="company-logo">

    <div class="spinner"></div>

    <div class="loading-text">
        Opening Application...
    </div>

</div>

<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxwbVlUeJxYeM0ZJi8fD-CseissJBsEtOquUnWm3KzolPx80lHJrU7Eb7LvasWQeJWI/exec";

// Keep all AppSheet query parameters
window.location.replace(
    APPS_SCRIPT_URL + window.location.search
);

</script>

</body>
</html>
