<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>First Choice Containers</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Tahoma,sans-serif;
}

body{
    background:linear-gradient(135deg,#0057B8,#2196F3);
    color:#fff;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.wrapper{
    text-align:center;
    width:90%;
    max-width:550px;
}

h1{
    font-size:42px;
    margin-bottom:10px;
}

.first{
    color:#4FC3F7;
}

.containers{
    color:#ff3b30;
}

p{
    opacity:.9;
    margin-bottom:35px;
    font-size:18px;
}

.spinner{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    border:8px solid rgba(255,255,255,.15);
    border-top:8px solid white;
    animation:spin 1s linear infinite;
}

.progress{
    margin-top:35px;
    width:100%;
    height:12px;
    border-radius:30px;
    overflow:hidden;
    background:rgba(255,255,255,.15);
}

.bar{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#4FC3F7,#fff,#ff3b30);
    animation:load 3s linear forwards;
}

#status{
    margin-top:20px;
    font-size:20px;
    font-weight:600;
}

.footer{
    margin-top:25px;
    opacity:.8;
    font-size:14px;
}

.box{
    position:absolute;
    width:80px;
    height:45px;
    border:2px solid rgba(255,255,255,.4);
    border-radius:5px;
    animation:move 12s linear infinite;
}

.box::before{
    content:"";
    position:absolute;
    left:8px;
    right:8px;
    top:9px;
    height:3px;
    background:white;
    box-shadow:0 8px white,0 16px white;
}

.b1{top:15%;left:-120px;}
.b2{top:45%;left:-180px;animation-delay:3s;}
.b3{top:75%;left:-140px;animation-delay:6s;}

@keyframes spin{
100%{transform:rotate(360deg);}
}

@keyframes load{
100%{width:100%;}
}

@keyframes move{
0%{transform:translateX(0);}
100%{transform:translateX(calc(100vw + 250px));}
}
</style>
</head>

<body>

<div class="box b1"></div>
<div class="box b2"></div>
<div class="box b3"></div>

<div class="wrapper">

<h1>
<span class="first">First Choice</span>
<span class="containers">Containers</span>
</h1>

<p>Please wait while we prepare your application...</p>

<div class="spinner"></div>

<div id="status">Starting...</div>

<div class="progress">
<div class="bar"></div>
</div>

<div class="footer">
Powered by First Choice Containers
</div>

</div>

<script>

const APPS_SCRIPT_URL="https://script.google.com/macros/s/AKfycbwEhnPgwywvIHbZlaWlkXZbfeCnlOFvd_HxjF0U3nfJFdn6cPzkknc88mCxq2Jjmpvg/exec";

const messages=[
"Loading quotation...",
"Connecting securely...",
"Preparing data...",
"Almost ready...",
"Redirecting..."
];

let i=0;

const status=document.getElementById("status");

status.textContent=messages[0];

const interval=setInterval(()=>{
    i=(i+1)%messages.length;
    status.textContent=messages[i];
},600);

setTimeout(()=>{
    clearInterval(interval);
    window.location.href=APPS_SCRIPT_URL+window.location.search;
},3000);

</script>

</body>
</html>
