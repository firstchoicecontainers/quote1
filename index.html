<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>First Choice Containers</title>

<style>
html,body{
    margin:0;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0057B8,#1E88E5);
    color:#fff;
    overflow:hidden;
}

.container{
    text-align:center;
    padding:20px;
}

h1{
    margin:0;
    font-size:42px;
}

.blue{
    color:#4FC3F7;
}

.red{
    color:#FF3B30;
}

p{
    margin-top:15px;
    font-size:18px;
}

.loader{
    width:90px;
    height:90px;
    margin:35px auto;
    border:8px solid rgba(255,255,255,.2);
    border-top:8px solid #fff;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

.progress{
    width:320px;
    max-width:90%;
    height:10px;
    background:rgba(255,255,255,.2);
    border-radius:20px;
    margin:auto;
    overflow:hidden;
}

.bar{
    height:100%;
    width:0%;
    background:#fff;
    animation:fill 3s linear forwards;
}

#countdown{
    margin-top:18px;
    font-size:20px;
    font-weight:bold;
}

@keyframes spin{
100%{transform:rotate(360deg);}
}

@keyframes fill{
100%{width:100%;}
}
</style>
</head>

<body>

<div class="container">

<h1>
<span class="blue">First Choice</span>
<span class="red">Containers</span>
</h1>

<p>Please wait while we prepare your request...</p>

<div class="loader"></div>

<div class="progress">
<div class="bar"></div>
</div>

<div id="countdown">
Redirecting in 3...
</div>

</div>

<script>
const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwEhnPgwywvIHbZlaWlkXZbfeCnlOFvd_HxjF0U3nfJFdn6cPzkknc88mCxq2Jjmpvg/exec";

let seconds = 3;

const timer = setInterval(() => {
    seconds--;
    if (seconds > 0) {
        document.getElementById("countdown").textContent =
            "Redirecting in " + seconds + "...";
    } else {
        clearInterval(timer);
        document.getElementById("countdown").textContent =
            "Opening application...";
        window.location.replace(APPS_SCRIPT_URL + window.location.search);
    }
}, 1000);
</script>

</body>
</html>
